<!DOCTYPE html>
<html>
<head>
    <title>Add Expense</title>
</head>
<body>

<h2>Add Expense</h2>

<form method="POST" action="/add_expense">

    <input type="number" name="amount" placeholder="Amount" required><br><br>

    <input type="text" name="category" placeholder="Category" required><br><br>

    <input type="text" name="description" placeholder="Description"><br><br>

    <input type="date" name="expense_date" required><br><br>

    <button type="submit">Save Expense</button>

</form>

</body>
</html>
